name: Package Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  pull_request:
    paths:
      - 'skills/**'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - id: list
        run: |
          skills=$(find skills -mindepth 1 -maxdepth 1 -type d | xargs -I{} basename {} | jq -R . | jq -sc .)
          echo "skills=$skills" >> $GITHUB_OUTPUT

  package:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ${{ matrix.skill }}
          path: skills/${{ matrix.skill }}/
          if-no-files-found: error
          retention-days: 90
