name: Package Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  pull_request:
    paths:
      - 'skills/**'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          skills=$(find skills -mindepth 1 -maxdepth 1 -type d | xargs -I{} basename {} | jq -R . | jq -sc .)
          echo "skills=$skills" >> $GITHUB_OUTPUT

  package:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}
          path: skills/${{ matrix.skill }}/
          if-no-files-found: error
          retention-days: 90
